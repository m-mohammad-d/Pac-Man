<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141a38"/>
      <stop offset="100%" stop-color="#060814"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="pelletGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Rect for Adaptive / Maskable -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#00d2ff" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Maze Grid Line Accent -->
  <path d="M 40 180 H 160 V 100" fill="none" stroke="#00d2ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M 472 332 H 352 V 412" fill="none" stroke="#00d2ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Pac-Man Body (Facing right, mouth open) -->
  <g filter="url(#neonGlow)">
    <path d="M 230 256 L 360 180 A 150 150 0 1 0 360 332 Z" fill="#ffe600"/>
    <!-- Eye -->
    <circle cx="240" cy="175" r="16" fill="#060814"/>
  </g>

  <!-- Pellets in front of mouth -->
  <g filter="url(#pelletGlow)">
    <circle cx="410" cy="256" r="22" fill="#ffffff"/>
    <circle cx="470" cy="256" r="14" fill="#ffe600"/>
  </g>
</svg>

